<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Inner Glass Card Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.6" />
    </linearGradient>

    <!-- 3D Box Gradients -->
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- 3D Supporting Hands/Robotic Gripper Gradients -->
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1E293B" flood-opacity="0.2" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3B82F6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Squircle Plate -->
  <rect x="40" y="40" width="420" height="420" rx="90" fill="url(#bgGrad)" filter="url(#softShadow)" />
  
  <!-- Inner Rounded Glass Container -->
  <rect x="110" y="110" width="280" height="280" rx="50" fill="url(#glassGrad)" filter="url(#innerShadow)" stroke="#FFFFFF" stroke-width="3" />

  <!-- 3D MANUAL HANDLING ELEMENTS -->
  <g transform="translate(0, -10)">
    <!-- Floor Shadow for Box -->
    <ellipse cx="250" cy="310" rx="70" ry="16" fill="#0F172A" opacity="0.15" />

    <!-- 3D Lifted Box (Manual Cargo) -->
    <g filter="url(#glow)">
      <!-- Top Face -->
      <polygon points="250,170 310,200 250,230 190,200" fill="url(#boxTop)" />
      <!-- Left Face -->
      <polygon points="190,200 250,230 250,285 190,255" fill="url(#boxFront)" />
      <!-- Right Face -->
      <polygon points="250,230 310,200 310,255 250,285" fill="url(#boxRight)" />
      <!-- Tape / Seal Strip on Box -->
      <polygon points="240,175 260,185 260,285 240,275" fill="#F59E0B" opacity="0.9" />
    </g>

    <!-- Ergonomic Support Hands / Protective Lifting Arms (Green Accent) -->
    <!-- Left Hand Base -->
    <path d="M 150 290 C 150 250, 190 245, 205 250 C 205 265, 185 285, 165 295 Z" fill="url(#handGrad)" filter="url(#innerShadow)" />
    <!-- Right Hand Base -->
    <path d="M 350 290 C 350 250, 310 245, 295 250 C 295 265, 315 285, 335 295 Z" fill="url(#handGrad)" filter="url(#innerShadow)" />

    <!-- Upward Motion / Safety Arrows (Glow Effect) -->
    <path d="M 250 145 L 235 160 H 245 V 175 H 255 V 160 H 265 Z" fill="#10B981" />
    <path d="M 215 160 L 205 170 H 212 V 182 H 218 V 170 H 225 Z" fill="#3B82F6" opacity="0.8" />
    <path d="M 285 160 L 275 170 H 282 V 182 H 288 V 170 H 295 Z" fill="#3B82F6" opacity="0.8" />
  </g>
</svg>
